name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - name: Check deployment scripts
        run: shellcheck deploy/*.sh
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high --prefix backend
      - run: npm audit --omit=dev --audit-level=high --prefix frontend

  publish:
    name: Publish ${{ matrix.image }} image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record published release
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          {
            echo "### Published $IMAGE_NAME"
            echo "Image: \`$IMAGE_NAME:sha-$GITHUB_SHA\`"
            echo "Deployment input image_tag: \`sha-$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
