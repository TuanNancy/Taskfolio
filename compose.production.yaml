# Standalone file: docker compose --env-file deploy/.env.production -f compose.production.yaml up -d --build
name: todo-tasks-production
services:
  api:
    image: ${IMAGE_PREFIX:-todo-tasks}-api:${APP_VERSION:-local}
    build: { context: ., dockerfile: backend/Dockerfile }
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: ${MONGO_URI:?Set your Atlas connection string}
      JWT_SECRET: ${JWT_SECRET:?Set a random signing secret}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://${DOMAIN:?Set a domain pointing to this server}
      COOKIE_SAME_SITE: lax
      TRUST_PROXY_HOPS: 1
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  web:
    image: ${IMAGE_PREFIX:-todo-tasks}-web:${APP_VERSION:-local}
    build: { context: ., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN:?Set a domain pointing to this server}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  caddy_data:
  caddy_config:
